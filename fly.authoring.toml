app = 'defensiverenting-authoring'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile.authoring'

[env]
  ENV        = 'production'
  LISTEN_ADDR = ':8081'
  LOG_LEVEL  = 'info'

[http_service]
  internal_port = 8081
  force_https   = true
  # Keep one machine always up: the "Generate a draft" button runs the AI
  # drafting job in a background goroutine (minutes) after the HTTP request
  # returns. With min=0 + auto-stop, Fly would stop the idle machine mid-draft
  # and kill the job. One 256MB machine always-on is negligible cost.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  initial_cluster_size = 1

  [http_service.concurrency]
    type       = 'requests'
    hard_limit = 10
    soft_limit = 5

  [[http_service.checks]]
    interval     = '15s'
    timeout      = '5s'
    grace_period = '10s'
    method       = 'GET'
    path         = '/healthz'

[[restart]]
  policy      = 'always'
  max_retries = 5

[[vm]]
  cpu_kind  = 'shared'
  cpus      = 1
  memory_mb = 256
