app = 'defensiverenting-authoring'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile.authoring'

[env]
  ENV        = 'production'
  LISTEN_ADDR = ':8081'
  LOG_LEVEL  = 'info'

[http_service]
  internal_port = 8081
  force_https   = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  initial_cluster_size = 1

  [http_service.concurrency]
    type       = 'requests'
    hard_limit = 10
    soft_limit = 5

  [[http_service.checks]]
    interval     = '15s'
    timeout      = '5s'
    grace_period = '10s'
    method       = 'GET'
    path         = '/healthz'

[[restart]]
  policy      = 'always'
  max_retries = 5

[[vm]]
  cpu_kind  = 'shared'
  cpus      = 1
  memory_mb = 256
