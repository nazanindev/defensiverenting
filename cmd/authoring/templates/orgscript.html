<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org contact script — Defensive Renting</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Space Grotesk', system-ui, sans-serif; background: #fdf8f8; color: #1e1215; margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 24px 60px; font-size: .95rem; line-height: 1.6; }
  .crumb { font-size: .82rem; margin-bottom: 10px; }
  .crumb a { color: #9b2335; text-decoration: none; }
  h1, h2 { font-family: 'Fraunces', serif; }
  h1 { font-size: 1.4rem; margin: 0 0 10px; }
  h2 { font-size: 1.1rem; margin: 26px 0 8px; }
  p, ul, ol, table { margin: 0 0 12px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #e8dede; padding: 4px 8px; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="crumb"><a href="/orgs">← Orgs</a></div>
  {{.Script}}
</main>
</body>
</html>
