name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-main:
    name: Deploy main site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml --app defensiverenting --dockerfile Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-authoring:
    name: Deploy authoring service
    runs-on: ubuntu-latest
    # Run after main to avoid parallel remote-builder conflicts that have
    # caused the wrong image to land on the authoring app three times.
    needs: deploy-main
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.authoring.toml --app defensiverenting-authoring --dockerfile Dockerfile.authoring
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test — authoring must require auth (401), not serve main site (200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://defensiverenting-authoring.fly.dev/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "ERROR: expected 401 from authoring app, got $STATUS — wrong image may be deployed"
            exit 1
          fi
