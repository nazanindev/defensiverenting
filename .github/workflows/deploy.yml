name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-main:
    name: Deploy main site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --local-only --config fly.toml --app defensiverenting --dockerfile Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MAIN_DEPLOY_TOKEN }}

  # Authoring runs on Railway (not Fly) so nothing else can deploy over it.
  # Requires a RAILWAY_TOKEN repo secret (project token scoped to the
  # "defensiverenting" project's production environment, service "authoring").
  deploy-authoring:
    name: Deploy authoring service (Railway)
    runs-on: ubuntu-latest
    env:
      AUTHORING_URL: https://defensiverenting-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        run: railway up --ci --service authoring
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Smoke test — authoring must require auth (401)
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$AUTHORING_URL/")
            echo "Attempt $i: HTTP status $STATUS"
            if [ "$STATUS" = "401" ]; then exit 0; fi
            sleep 5
          done
          echo "ERROR: expected 401 after 5 attempts, got $STATUS"
          exit 1
